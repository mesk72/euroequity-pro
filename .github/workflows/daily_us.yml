name: Daily US Update

on:
  schedule:
    - cron: '0 2 * * 2-6'
  workflow_dispatch:

concurrency:
  group: na-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-us:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install yfinance requests pandas numpy
      - name: Run US daily load
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LEEWAY_KEY: ${{ secrets.LEEWAY_KEY }}
        run: python daily_us.py | tee daily_us_last_output.txt
      - name: Commit output log via API
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python commit_via_api.py daily_us_last_output.txt

      - name: Health check
        if: always()
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python health_check.py | tee health_status_us.txt
      - name: Commit health status via API
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python commit_via_api.py health_status_us.txt
