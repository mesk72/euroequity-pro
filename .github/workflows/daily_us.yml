name: Daily US Update

on:
  schedule:
    - cron: '0 0 * * 2-6'
  workflow_dispatch:

concurrency:
  group: na-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-us:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install yfinance requests pandas numpy
      - name: Run US daily load
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LEEWAY_KEY: ${{ secrets.LEEWAY_KEY }}
        run: python daily_us.py

      - name: Health check
        if: always()
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python health_check.py | tee health_status.txt
      - name: Commit health status
        if: always()
        run: |
          git config user.name "debug-bot"
          git config user.email "debug-bot@users.noreply.github.com"
          git add health_status.txt
          git commit -m "health check 2026-07-08T19:54:13Z" || echo "nothing to commit"
          git pull --rebase
          git push
