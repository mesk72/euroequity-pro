name: Surgical Test
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python surgical_test.py
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LEEWAY_KEY: ${{ secrets.LEEWAY_KEY }}
      - name: Commit output
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CONTENT=$(base64 -w0 surgical_test_output.txt)
          SHA=$(curl -s -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/contents/surgical_test_output.txt" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('sha',''))")
          python3 -c "
import json
payload = {'message': 'surgical test output', 'content': '''$CONTENT'''}
if '$SHA':
    payload['sha'] = '$SHA'
print(json.dumps(payload))
" > /tmp/payload.json
          curl -s -X PUT -H "Authorization: token $GH_TOKEN" -H "Content-Type: application/json" --data @/tmp/payload.json "https://api.github.com/repos/${{ github.repository }}/contents/surgical_test_output.txt"
