name: Verify US Suffix Bug
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python verify_us_suffix_bug.py | tee verify_us_suffix_bug_output.txt
        env:
          LEEWAY_KEY: ${{ secrets.LEEWAY_KEY }}
      - if: always()
        run: |
          git config user.name "debug-bot"
          git config user.email "debug-bot@users.noreply.github.com"
          git add verify_us_suffix_bug_output.txt
          git commit -m "check" || echo none
          git pull --rebase
          git push
