name: Fetch FMP Website GCC

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python fetch_fmp_website_gcc.py | tee fetch_fmp_website_gcc_output.txt
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - if: always()
        run: |
          git config user.name "debug-bot"
          git config user.email "debug-bot@users.noreply.github.com"
          git add website_gcc_fmp_addon.csv fetch_fmp_website_gcc_output.txt
          git commit -m "website GCC via FMP (gap Yahoo)" || echo "nothing to commit"
          git pull --rebase
          git push
