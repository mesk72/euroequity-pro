name: Daily US Yahoo Finance

on:
  workflow_dispatch:  # DISABILITATO — non gira automaticamente

jobs:
  update-us-yahoo:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install yfinance requests pandas numpy
      - name: Run US daily Yahoo
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python daily_us_yahoo.py | tee daily_us_yahoo_last_output.txt
      - name: Commit log
        continue-on-error: true
        if: always()
        run: |
          git config user.name "debug-bot"
          git config user.email "debug-bot@users.noreply.github.com"
          cp daily_us_yahoo_last_output.txt /tmp/log_backup.txt
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/log_backup.txt daily_us_yahoo_last_output.txt
            git add daily_us_yahoo_last_output.txt
            git commit -m "log daily_us_yahoo output" || echo "nothing to commit"
            if git push origin main; then
              echo "Push riuscito al tentativo $i"
              break
            else
              echo "Tentativo $i fallito, riprovo..."
              sleep 5
            fi
          done
