name: Daily US Yahoo Finance

on:
  workflow_dispatch:
  schedule:
    # Orari a minuti dispari: GitHub accoda i lavori programmati e negli
    # orari tondi il ritardo e' sistematico (misurato sul daily US:
    # oltre 3 ore ogni giorno dal 2 al 5 agosto, sempre verso le 04:00
    # invece delle 00:30). I minuti dispari riducono molto la coda.
    - cron: '23 1 * * *'    # 03:23 italiane
    # Passata delle 06:00 italiane, due ore prima del rapporto: l'8/8
    # erano 57 i titoli americani che Yahoo aveva pubblicato dopo la
    # passata notturna e che restavano indietro fino al giorno dopo.
    # Spostata dalle 06:00 alle 07:00 italiane (05:00 UTC). Motivo,
    # misurato l'8/8/2026: Yahoo pubblica le chiusure dei titoli minori
    # molte ore dopo quelle dei grandi. Alle 02:42 italiane il log
    # registrava "ultima seduta su Yahoo: 6 agosto" per 58 titoli
    # americani; alle 11:50 lo stesso dato c'era. Piu' tardi si chiede,
    # piu' titoli si trovano. Le 07:00 lasciano comunque un'ora di
    # margine prima del rapporto delle 08:00.
    - cron: '0 5 * * *'     # 07:00 italiane

concurrency:
  group: daily-us-yahoo
  cancel-in-progress: false

jobs:
  update-us-yahoo:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install yfinance requests pandas numpy
      - name: Run US daily Yahoo
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_WORKFLOW: daily_us_yahoo.yml
        run: |
          set -o pipefail
          python daily_us_yahoo.py 2>&1 | tee daily_us_yahoo_last_output.txt
      - name: Commit log
        if: always()
        run: |
          git config user.name "debug-bot"
          git config user.email "debug-bot@users.noreply.github.com"
          cp daily_us_yahoo_last_output.txt /tmp/log_backup.txt
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/log_backup.txt daily_us_yahoo_last_output.txt
            git add daily_us_yahoo_last_output.txt
            git commit -m "log daily_us_yahoo output" || echo "nothing to commit"
            if git push origin main; then
              echo "Push riuscito al tentativo $i"
              break
            else
              echo "Tentativo $i fallito, riprovo..."
              sleep 5
            fi
          done
