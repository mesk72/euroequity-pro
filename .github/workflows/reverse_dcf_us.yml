name: Reverse Earnings Model US

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Fetch Beta US (Yahoo Finance)"]
    types:
      - completed

jobs:
  compute:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install requests pandas
      - name: Compute
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python reverse_dcf_us.py | tee reverse_dcf_us_last_output.txt
      - name: Commit log via API (evita conflitti git tra script paralleli)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CONTENT=$(base64 -w0 reverse_dcf_us_last_output.txt)
          SHA=$(curl -s -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/contents/reverse_dcf_us_last_output.txt" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('sha',''))")
          python3 -c "
import json
payload = {'message': 'log reverse earnings model output', 'content': '''$CONTENT'''}
if '$SHA':
    payload['sha'] = '$SHA'
print(json.dumps(payload))
" > /tmp/payload.json
          curl -s -X PUT -H "Authorization: token $GH_TOKEN" -H "Content-Type: application/json" --data @/tmp/payload.json "https://api.github.com/repos/${{ github.repository }}/contents/reverse_dcf_us_last_output.txt"
