name: Weekly US Load

on:
  schedule:
    - cron: '0 7 * * 0'
  workflow_dispatch:

concurrency:
  group: na-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  weekly-us:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests pandas
      - name: Run Weekly US
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LEEWAY_KEY: ${{ secrets.LEEWAY_KEY }}
        run: python weekly_us.py
