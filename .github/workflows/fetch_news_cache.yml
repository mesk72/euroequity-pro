name: Fetch News Cache

on:
  schedule:
    - cron: '0 * * * *'    # ogni ora — top 200/50/50
    - cron: '30 */3 * * *' # ogni 3 ore — restanti 1300/1450/1450
  workflow_dispatch:
    inputs:
      mode:
        description: 'all = restanti ticker, vuoto = solo top'
        required: false
        default: ''

jobs:
  fetch-top:
    if: github.event.schedule == '0 * * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == '')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Fetch top news
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python fetch_news_cache.py

  fetch-rest:
    if: github.event.schedule == '30 */3 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Fetch rest news
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python fetch_news_cache.py all
