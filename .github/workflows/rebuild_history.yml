name: Rebuild Price History (5y, one-time)

on:
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install requests yfinance pandas
      - name: Rebuild history
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python rebuild_history_all.py | tee rebuild_history_output.txt
      - name: Commit log
        continue-on-error: true
        if: always()
        run: |
          git config user.name "debug-bot"
          git config user.email "debug-bot@users.noreply.github.com"
          git add rebuild_history_output.txt
          git commit -m "log rebuild history output" || echo "nothing to commit"
          git pull --rebase
          git push
