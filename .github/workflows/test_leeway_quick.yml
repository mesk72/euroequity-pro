name: Test Leeway API

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Test Leeway
        env:
          LEEWAY_KEY: ${{ secrets.LEEWAY_KEY }}
        run: python test_leeway_quick.py
