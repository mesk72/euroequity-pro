name: Apply 3Y5Y All
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install requests python-dateutil
      - run: python apply_3y5y_all.py 2>&1 | tee apply_3y5y_all_output.txt
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - if: always()
        run: |
          git config user.name "debug-bot"
          git config user.email "debug-bot@users.noreply.github.com"
          git add apply_3y5y_all_output.txt
          git commit -m "check" || echo none
          git pull --rebase
          git push
