name: Update Universe GCC

on:
  workflow_dispatch:

concurrency:
  group: gcc-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Update
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python universe_gcc.py | tee universe_gcc_output.txt
      - name: Commit output
        if: always()
        run: |
          git config user.name "debug-bot"
          git config user.email "debug-bot@users.noreply.github.com"
          git add universe_gcc_output.txt
          git commit -m "log universo gcc" || echo none
          git pull --rebase
          git push
