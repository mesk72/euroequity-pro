name: Test Website Col

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Test
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python test_website_col.py | tee test_website_output.txt
      - name: Commit
        if: always()
        run: |
          git config user.name "debug-bot"
          git config user.email "debug-bot@users.noreply.github.com"
          git add test_website_output.txt
          git commit -m "test website column" || echo "nothing to commit"
          git pull --rebase
          git push
