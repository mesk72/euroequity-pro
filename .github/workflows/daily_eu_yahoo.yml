name: Daily EU Yahoo Finance

on:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *'  # 02:30 CEST - backup nativo GitHub, indipendente da Vercel

concurrency:
  group: daily-eu-yahoo
  cancel-in-progress: false  # se parte un secondo trigger mentre uno gira, aspetta invece di sovrapporsi

jobs:
  update-eu-yahoo:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install yfinance requests pandas numpy
      - name: Run EU daily Yahoo
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_WORKFLOW: daily_eu_yahoo.yml
        run: python daily_eu_yahoo.py
