name: Daily EU Yahoo Finance

on:
  workflow_dispatch:
  schedule:
    # Orari a minuti dispari: GitHub accoda i lavori programmati e negli
    # orari tondi il ritardo e' sistematico (misurato sul daily US:
    # oltre 3 ore ogni giorno dal 2 al 5 agosto, sempre verso le 04:00
    # invece delle 00:30). I minuti dispari riducono molto la coda.
    # FIX 5/8/2026: spostato dalle 00:30 UTC alle 19:00 UTC (21:00 italiane
    # d'estate, 20:00 d'inverno). Alle 00:30 lo script prendeva sempre la
    # seduta del GIORNO PRIMA: girando la sera, dopo la chiusura europea
    # delle 17:30, prende la seduta appena conclusa e il sito e' aggiornato
    # la sera stessa invece che l'indomani. Yahoo pubblica le chiusure
    # europee definitive circa 40 minuti dopo la campana (verificato il
    # 4/8/2026 su otto titoli, con doppia lettura a un'ora di distanza).
    # ERA '7 19': sette minuti dopo il cron di Vercel delle 19:00. Le due
    # esecuzioni si sovrapponevano e, per via del blocco di concorrenza,
    # la seconda ANNULLAVA la prima: il 6/8 l'esecuzione serale europea
    # e' stata cancellata dopo 15 minuti e l'Europa e' rimasta indietro di
    # un giorno. La riserva deve partire quando la prima e' gia' finita
    # (dura circa 10-12 minuti), non mentre sta lavorando.
    - cron: '35 19 * * *'
    # Seconda passata a notte fonda: recupera i titoli che alle 21 non
    # fossero ancora stati pubblicati da Yahoo.
    - cron: '13 1 * * *'

concurrency:
  group: daily-eu-yahoo
  cancel-in-progress: false  # se parte un secondo trigger mentre uno gira, aspetta invece di sovrapporsi

jobs:
  update-eu-yahoo:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install yfinance requests pandas numpy
      - name: Run EU daily Yahoo
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_WORKFLOW: daily_eu_yahoo.yml
        run: python daily_eu_yahoo.py
