name: Fetch FY US Addon

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install requests yfinance
      - name: Fetch
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python fetch_fy_us_addon.py
      - name: Commit CSV
        if: always()
        run: |
          git config user.name "debug-bot"
          git config user.email "debug-bot@users.noreply.github.com"
          git add fiscal_year_end_us_addon.csv
          git commit -m "fiscal year end US addon CSV" || echo "nothing to commit"
          git pull --rebase
          git push
