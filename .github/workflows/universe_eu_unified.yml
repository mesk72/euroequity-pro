name: Update Universe EU (16 mercati unificato)

on:
  workflow_dispatch:

concurrency:
  group: universe-eu-unified
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Update
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LEEWAY_KEY: ${{ secrets.LEEWAY_KEY }}
        run: python universe_eu_unified.py | tee universe_eu_unified_output.txt
      - name: Commit output
        if: always()
        run: |
          git config user.name "debug-bot"
          git config user.email "debug-bot@users.noreply.github.com"
          git add universe_eu_unified_output.txt
          git commit -m "log universe_eu_unified output" || echo "nothing to commit"
          git pull --rebase
          git push
