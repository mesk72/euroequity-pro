name: Daily APAC Update

on:
  # DISABILITATO 28/7/2026 — basato su Leeway, dismesso mesi fa. Falliva
  # silenziosamente ogni giorno (run sempre "cancelled"), lasciando KRX/SGX
  # senza aggiornamenti senza che nessun errore fosse visibile. Questi due
  # mercati sono ora inclusi in daily_apac_yahoo.py/.yml.
  workflow_dispatch:

concurrency:
  group: apac-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-apac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests pandas numpy
      - name: Run APAC daily load
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LEEWAY_KEY: ${{ secrets.LEEWAY_KEY }}
        run: python daily_apac.py

      - name: Health check
        if: always()
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python health_check.py | tee health_status_apac.txt
      - name: Commit health status
        if: always()
        run: |
          git config user.name "debug-bot"
          git config user.email "debug-bot@users.noreply.github.com"
          git add health_status_apac.txt
          git commit -m "health check 2026-07-08T19:54:13Z" || echo "nothing to commit"
          git pull --rebase
          git push
