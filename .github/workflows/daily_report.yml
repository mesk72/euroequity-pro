name: Rapporto giornaliero via email

on:
  workflow_dispatch:
  schedule:
    # Orari a minuti dispari: GitHub accoda i lavori programmati e negli
    # orari tondi il ritardo e' sistematico (misurato sul daily US:
    # oltre 3 ore ogni giorno dal 2 al 5 agosto, sempre verso le 04:00
    # invece delle 00:30). I minuti dispari riducono molto la coda.
    # 06:00 UTC = 08:00 in Italia con l'ora legale, 07:00 con l'ora solare.
    # GitHub usa sempre UTC, non segue il cambio dell'ora italiano.
        # Distanza dal cron di Vercel: almeno 30 minuti. Se le due esecuzioni
    # partono ravvicinate, il blocco di concorrenza fa si' che la seconda
    # ANNULLI la prima invece di proteggerla (successo il 6/8 sull'Europa:
    # esecuzione serale cancellata dopo 15 minuti). La riserva deve
    # partire solo quando la principale e' gia' conclusa.
    - cron: '40 6 * * *'

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Installa dipendenze
        run: pip install requests yfinance pandas
      - name: Genera e invia il rapporto
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
        run: python daily_report.py
