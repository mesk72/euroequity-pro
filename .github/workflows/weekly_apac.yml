name: Weekly APAC Update

on:
  schedule:
    - cron: '0 8 * * 0'
  workflow_dispatch:

concurrency:
  group: apac-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-apac-weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests pandas numpy
      - name: Run APAC weekly load
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LEEWAY_KEY: ${{ secrets.LEEWAY_KEY }}
        run: python weekly_apac.py | tee weekly_apac_last_output.txt
      - name: Commit output log
        if: always()
        run: |
          git config user.name "debug-bot"
          git config user.email "debug-bot@users.noreply.github.com"
          git add weekly_apac_last_output.txt
          git commit -m "log weekly_apac output" || echo "nothing to commit"
          git pull --rebase
          git push
