name: Debug Leeway Test

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Debug
        env:
          LEEWAY_KEY: ${{ secrets.LEEWAY_KEY }}
        run: python debug_leeway_test.py
