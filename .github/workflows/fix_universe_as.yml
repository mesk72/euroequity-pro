name: Fix Universe AS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Fix AS
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LEEWAY_KEY: ${{ secrets.LEEWAY_KEY }}
        run: python fix_universe_as.py | tee debug_output_as.txt
      - name: Commit output
        run: |
          git config user.name "debug-bot"
          git config user.email "debug-bot@users.noreply.github.com"
          git add debug_output_as.txt
          git commit -m "output fix universo AS" || echo "nothing to commit"
          git pull --rebase
          git push
