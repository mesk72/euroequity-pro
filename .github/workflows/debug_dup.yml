name: Debug Dup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Debug
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python debug_dup.py | tee debug_dup_output.txt
      - name: Commit output
        if: always()
        run: |
          git config user.name "debug-bot"
          git config user.email "debug-bot@users.noreply.github.com"
          git add debug_dup_output.txt
          git commit -m "debug dup output" || echo "nothing to commit"
          git pull --rebase
          git push
