name: Test Yahoo Beta2
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install requests yfinance
      - run: python test_yahoo_beta2.py | tee test_yahoo_beta2_output.txt
      - if: always()
        run: |
          git config user.name "debug-bot"
          git config user.email "debug-bot@users.noreply.github.com"
          git add test_yahoo_beta2_output.txt
          git commit -m "check" || echo none
          git pull --rebase
          git push
