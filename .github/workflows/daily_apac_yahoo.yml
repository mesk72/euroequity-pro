name: Daily APAC Yahoo Finance

on:
  workflow_dispatch:
  schedule:
    # Orari a minuti dispari: GitHub accoda i lavori programmati e negli
    # orari tondi il ritardo e' sistematico (misurato sul daily US:
    # oltre 3 ore ogni giorno dal 2 al 5 agosto, sempre verso le 04:00
    # invece delle 00:30). I minuti dispari riducono molto la coda.
        # Distanza dal cron di Vercel: almeno 30 minuti. Se le due esecuzioni
    # partono ravvicinate, il blocco di concorrenza fa si' che la seconda
    # ANNULLI la prima invece di proteggerla (successo il 6/8 sull'Europa:
    # esecuzione serale cancellata dopo 15 minuti). La riserva deve
    # partire solo quando la principale e' gia' conclusa.
    # PASSATA DEL MATTINO, aggiunta 12/8/2026. Le borse asiatiche chiudono
    # fra le 8 e le 11 italiane, ma la prima passata era alle 18:40: dalle
    # 8 alle 18 il sito mostrava la seduta del giorno PRIMA, proprio nelle
    # ore in cui viene guardato. Verificato il 12/8 alle 14:51: Yahoo aveva
    # gia' la chiusura di Tokyo del 12, il nostro database si fermava al 10.
    # Singapore chiude alle 11:00 italiane (09:00 UTC): alle 09:30 UTC tutte
    # le piazze asiatiche hanno chiuso.
    - cron: '30 9 * * *'    # 11:30 italiane, subito dopo la chiusura asiatica
    - cron: '40 16 * * *'   # 18:40 italiane
    # Seconda passata alle 23:00 italiane (21:00 UTC). Le borse asiatiche
    # chiudono fra le 8 e le 11 del mattino: a quest'ora Yahoo ha avuto
    # 12 ore per pubblicare anche i titoli meno scambiati, che sono quelli
    # che il download delle 18:40 perde regolarmente (Tokyo e Hong Kong).
    - cron: '0 21 * * *'    # 23:00 italiane

concurrency:
  group: daily-apac-yahoo
  cancel-in-progress: false

jobs:
  update-apac-yahoo:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install yfinance requests pandas numpy
      - name: Run APAC daily Yahoo
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_WORKFLOW: daily_apac_yahoo.yml
        run: python daily_apac_yahoo.py
