name: Fetch APAC Website Beta
on:
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install requests yfinance
      - run: python fetch_apac_website.py | tee fetch_apac_website_last_output.txt
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - name: Commit log
        continue-on-error: true
        if: always()
        run: |
          git config user.name "debug-bot"
          git config user.email "debug-bot@users.noreply.github.com"
          git add fetch_apac_website_last_output.txt
          git commit -m "log apac website output" || echo "nothing to commit"
          git pull --rebase
          git push
